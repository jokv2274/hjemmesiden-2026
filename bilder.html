<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilder</title>
    <meta name="description" content="Bilder og portefølje for John-Olav Kvarme." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="styles.css?v=20261011f" />
  </head>
  <body class="inner-page">
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">John-Olav Kvarme</a>
        <nav class="nav" aria-label="Hovednavigasjon">
          <a href="bilder.html" class="active">Bilder</a>
          <a href="om-meg.html">Om meg</a>
          <a href="kontakt.html">Kontakt</a>
          <a href="admin.html" class="nav-admin-link">Logg inn</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="container orbit-section">
        <div class="gallery-intro category-intro">
          <span class="eyebrow">Utforsk porteføljen</span>
          <h1>Bilder</h1>
          <p>Fra virkelige øyeblikk til digitale visjoner. Velg en kategori for å se bildene.</p>
        </div>

        <div class="swiper mySwiper gallery-swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <a href="galleri1.html" aria-label="Gå til AI-kunst"><img src="Bilder%20forside/a1.jpg" alt="AI-kunst" /><span class="slide-title">AI-kunst</span></a>
            </div>
            <div class="swiper-slide">
              <a href="galleri2.html" aria-label="Gå til Dyr"><img src="Bilder%20forside/image_26cc46-kan-du-gjre-en-mrk-utgave-ogs-som-i-stad.jpg" alt="Kronhjort i mørk blåtime" /><span class="slide-title">Dyr</span></a>
            </div>
            <div class="swiper-slide">
              <a href="galleri3.html" aria-label="Gå til Ferie"><img src="Bilder%20forside/paskeoya-ahu-tongariki-15-moai-2001-mittblikk.jpg" alt="Påskeøya – Ahu Tongariki" /><span class="slide-title">Ferie</span></a>
            </div>
            <div class="swiper-slide">
              <a href="bilder-fotokunst.html" aria-label="Gå til Fotokunst"><img src="Bilder%20forside/kunst-storm-over-norge-02-mor-med-barn-statue-fjell.jpg.jpg" alt="Mor og barn som skulptur mot et dramatisk norsk fjellandskap" /><span class="slide-title">Fotokunst</span></a>
            </div>
            <div class="swiper-slide">
              <a href="bilder-norge.html" aria-label="Gå til Norge"><img src="Bilder%20forside/norge-helleren-jossingfjord-rod-hus-under-heller-proff-mittblikk.jpg" alt="Helleren i Jøssingfjord" /><span class="slide-title">Norge</span></a>
            </div>
            <div class="swiper-slide">
              <a href="galleri5.html" aria-label="Gå til By og urban"><img src="Bilder%20forside/5a.jpg" alt="By / Urban" /><span class="slide-title">By / Urban</span></a>
            </div>
            <div class="swiper-slide">
              <a href="galleri6.html" aria-label="Gå til Kreative prosjekter"><img src="Bilder%20forside/6a.jpg" alt="Kreative prosjekter" /><span class="slide-title">Kreative prosjekter</span></a>
            </div>
            <div class="swiper-slide">
              <a href="galleri7.html" aria-label="Gå til Humor"><img src="Bilder%20forside/7a.jpg" alt="Humor" /><span class="slide-title">Humor</span></a>
            </div>
          </div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-pagination"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      const swiper = new Swiper(".mySwiper", {
        direction: "horizontal",
        effect: "coverflow",
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: "auto",
        loop: true,
        loopAdditionalSlides: 1,
        slidesPerGroup: 1,
        speed: 900,
        autoplay: { delay: 2500, disableOnInteraction: false },
        coverflowEffect: { rotate: 30, stretch: 0, depth: 200, modifier: 1.2, slideShadows: false },
        pagination: { el: ".swiper-pagination", clickable: true },
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" }
      });
      document.addEventListener("copy", (event) => event.preventDefault());
      document.addEventListener("contextmenu", (event) => {
        if (event.target.tagName === "IMG" || event.target.closest(".gallery-swiper")) event.preventDefault();
      });
    </script>
    <script src="script.js"></script>
  </body>
</html>
