<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrasjon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20261008" />
  </head>
  <body class="inner-page">
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">John-Olav Kvarme</a>
        <nav class="nav" aria-label="Hovednavigasjon">
          <a href="bilder.html">Bilder</a>
          <a href="om-meg.html">Om meg</a>
          <a href="kontakt.html">Kontakt</a>
          <a href="admin.html" class="nav-admin-link">Logg inn</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="container admin-shell">
        <div id="login-section" class="admin-card">
          <h1>Logg inn</h1>
          <p class="admin-subtitle">Kun for administrasjon av galleriet.</p>
          <form id="login-form" class="admin-form">
            <label for="email">E-post</label>
            <input type="email" id="email" required autocomplete="username" />
            <label for="password">Passord</label>
            <input type="password" id="password" required autocomplete="current-password" />
            <p id="login-error" class="admin-error"></p>
            <button type="submit" class="primary-btn">Logg inn</button>
          </form>
        </div>

        <div id="upload-section" class="admin-card" hidden>
          <div class="admin-header-row">
            <h1>Last opp bilde</h1>
            <button id="logout-btn" class="secondary-btn">Logg ut</button>
          </div>

          <form id="upload-form" class="admin-form">
            <label for="category-select">Kategori</label>
            <select id="category-select">
              <option value="ai-kunst">AI‑kunst: Lys og drøm</option>
              <option value="dyr">Dyr</option>
              <option value="ferie">Ferie</option>
              <option value="natur">Natur</option>
              <option value="by-urban">By / Urban</option>
              <option value="kreative-prosjekter">Kreative prosjekter</option>
              <option value="humor">Humor</option>
            </select>
            <label for="file-input">Velg bilde</label>
            <input type="file" id="file-input" accept="image/*" capture="environment" required />
            <p id="upload-status" class="admin-status"></p>
            <button type="submit" class="primary-btn">Last opp</button>
          </form>

          <h2 class="admin-section-title">Bilder i valgt kategori</h2>
          <div id="image-list" class="admin-image-grid"></div>
        </div>
      </section>
    </main>

    <script type="module" src="admin.js"></script>
  </body>
</html>
